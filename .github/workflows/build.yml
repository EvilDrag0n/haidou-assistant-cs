name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译（Windows 自带 csc.exe，无需 SDK）
        shell: cmd
        run: build.bat

      - name: 自检（--selftest，无需游戏客户端）
        shell: cmd
        run: |
          start "" /b /wait out\HaiDouAssistant.exe --selftest > selftest-output.txt 2>&1
          if errorlevel 1 (
            type selftest-output.txt
            exit /b 1
          )
          type selftest-output.txt

      - name: 打包分发目录
        shell: pwsh
        run: |
          $stage = "dist/HaiDouAssistant"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item out/HaiDouAssistant.exe, out/app.ico, out/*.dll -Destination $stage
          Copy-Item out/data, out/wwwroot -Destination $stage -Recurse
          Copy-Item docs/RELEASE-1.3.1.md, docs/VERIFY-CHECKLIST.md -Destination $stage
          Compress-Archive -Path $stage -DestinationPath dist/HaiDouAssistant-win64.zip -Force
          Get-FileHash dist/HaiDouAssistant-win64.zip -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: HaiDouAssistant-win64
          path: dist/HaiDouAssistant-win64.zip
          if-no-files-found: error
